<ossec_config>

  <!-- Conexión al manager de Wazuh Cloud -->
  <client>
    <server>
      <address>WAZUH_MANAGER_PLACEHOLDER</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <enrollment>
      <enabled>yes</enabled>
    </enrollment>
  </client>

  <!-- Monitoreo de logs JSON de los contenedores Docker -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/lib/docker/containers/*/*.log</location>
  </localfile>

  <!-- Monitoreo de logs del sistema del host -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/syslog</location>
  </localfile>

  <logging>
    <log_format>plain</log_format>
  </logging>

  <active-response>
    <disabled>yes</disabled>
  </active-response>

</ossec_config>
