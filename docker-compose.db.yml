# Instancia Base de datos — 32.192.14.48
# Uso: docker-compose -f docker-compose.db.yml up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: alcaldia_db
      POSTGRES_USER: alcaldia_app
      POSTGRES_PASSWORD: ${DB_PASSWORD}    # definir en .env del servidor
    ports:
      - "5432:5432"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alcaldia_app -d alcaldia_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data: